[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "duologue"
version = "0.1.0.dev0"
description = "One conversation, two coding agents. Switch sides whenever you like."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "duologue contributors" }]
keywords = ["claude-code", "codex", "coding-agents", "transcripts", "sync"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
# The runtime is standard-library only; tests/unit/test_package.py keeps it that way.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.17,<0.18",
]

[project.urls]
Homepage = "https://github.com/creynir/duologue"
Issues = "https://github.com/creynir/duologue/issues"

[project.scripts]
duologue = "duologue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not e2e"]
markers = [
    "integration: hermetic homes, a fake Codex app-server and mock model servers; runs in CI",
    "e2e: real Claude Code and Codex CLIs on throwaway sessions; never in CI, run with -m e2e",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
